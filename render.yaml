services:
  - type: web
    name: studious-robot-signaling
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false   # set in the Render dashboard to your mobile app origin(s)
      # Persist sessions/presence and enable multi-instance fan-out via Redis.
      # The connection string is injected from the managed key-value instance
      # below; when REDIS_URL is set the server boots the Redis-backed stores.
      - key: REDIS_URL
        fromService:
          name: studious-robot-redis
          type: keyvalue
          property: connectionString
      # Session token lifetime (milliseconds).  Clients proactively refresh at
      # ~80% of this interval.  3 600 000 = 1 hour.
      - key: SESSION_TTL_MS
        value: 3600000

  # Managed Redis (Render "Key Value") for session/presence persistence and the
  # Socket.IO Redis adapter / cross-instance message bus.
  - type: keyvalue
    name: studious-robot-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []   # only reachable from Render services (no external access)

