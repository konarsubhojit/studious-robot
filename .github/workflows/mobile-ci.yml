name: Mobile CI

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.nvmrc'
      - '.github/actions/setup-ci/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'mobile/**'
      - 'shared/**'
      - '.nvmrc'
      - '.github/actions/setup-ci/**'
      - '.github/workflows/mobile-ci.yml'

# Cancel any in-progress run for the same branch so stale commits don't waste
# runner time.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: [self-hosted, Linux, X64, studious-robot-ci]
    timeout-minutes: 20

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up CI dependencies
        uses: ./.github/actions/setup-ci
        with:
          package: mobile
          cache-scope: ci

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --ci --maxWorkers=2
