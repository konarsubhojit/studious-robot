name: Mobile CI

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: this workflow only needs to read repository contents.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
