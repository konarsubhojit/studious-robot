name: Backend CI & Deploy (self-hosted)

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'shared/**'
      - '.nvmrc'
      - '.github/actions/setup-ci/**'
      - '.github/workflows/backend-ci-self-hosted.yml'
  pull_request:
    branches: [master]
    paths:
      - 'server/**'
      - 'shared/**'
      - '.nvmrc'
      - '.github/actions/setup-ci/**'
      - '.github/workflows/backend-ci-self-hosted.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy master after tests (requires production environment approval)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Lint, build & test
    if: github.event_name == 'workflow_dispatch' || vars.SELF_HOSTED_CI_ENABLED == 'true'
    runs-on: [self-hosted, Linux, X64, studious-robot-ci]
    timeout-minutes: 20
    concurrency:
      group: backend-test-self-hosted-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        working-directory: server

    # Postgres service so the Drizzle migration + store tests run against a real
    # database in CI.  Credentials are ephemeral and scoped to this job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studious_test
        ports:
          - '127.0.0.1::5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Connection components for the ephemeral CI Postgres service. The full
      # DATABASE_URL(s) are composed from these in a step below to avoid
      # embedding a credential-shaped literal in the workflow.
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: studious_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up CI dependencies
        uses: ./.github/actions/setup-ci
        with:
          package: server
          cache-scope: ci

      - name: Compose database URLs
        # App (pooled) and migration (direct) URLs point at the same CI service.
        env:
          PGPORT: ${{ job.services.postgres.ports[5432] }}
        run: |
          set -euo pipefail
          test -n "$PGPORT"
          echo "PGPORT=${PGPORT}" >> "$GITHUB_ENV"
          URL="postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          echo "DATABASE_URL=${URL}" >> "$GITHUB_ENV"
          echo "DATABASE_URL_DIRECT=${URL}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Check for uncommitted schema drift
        # Regenerating migrations from the schema must produce no changes; a
        # non-empty diff means db/schema.ts was edited without `npm run db:generate`.
        run: |
          npm run db:generate
          git diff --exit-code db/migrations

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    name: Deploy to Oracle Cloud VM
    runs-on: [self-hosted, Linux, X64, studious-robot-deploy]
    timeout-minutes: 20
    environment: production
    needs: test
    # Shadow runs never deploy automatically while the hosted workflow is live.
    if: github.ref == 'refs/heads/master' && github.event_name == 'workflow_dispatch' && inputs.deploy

    # Serialize deploys per branch so concurrent pushes to master can't
    # overlap SSH reset/install/restart cycles on the same host.
    concurrency:
      group: backend-deploy-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up CI dependencies
        uses: ./.github/actions/setup-ci
        with:
          package: server
          cache-scope: deploy

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Apply database migrations
        # Runs against the direct (unpooled) Neon endpoint before the new code
        # starts. drizzle-kit is a dev dependency, so migrations run here on the
        # runner rather than on the VM (which installs with --omit=dev). Skipped
        # when DATABASE_URL_DIRECT is not configured.
        working-directory: server
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          if [ -n "${DATABASE_URL_DIRECT:-}" ]; then
            npm run db:migrate
          else
            echo "DATABASE_URL_DIRECT not set; skipping migrations"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # DEPLOY_SSH_PORT defaults to 22 when the secret is not set
          port: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            cd ~/repos/studious-robot
            git fetch --quiet origin master
            git reset --hard origin/master
            # Install prod deps and restart the service via the shared deploy
            # script (single source of truth for VM + CI deploys). Graceful,
            # rolling-friendly restart: systemd sends SIGTERM, the app drains
            # in-flight connections (see TimeoutStopSec in the unit file), then
            # the new process starts. The script re-verifies the service is
            # active afterwards and fails the job if it did not come back up.
            bash deploy/deploy.sh
