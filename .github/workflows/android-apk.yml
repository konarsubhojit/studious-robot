name: Android APK

on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

# Cancel any in-progress run for the same branch so stale commits don't waste
# runner time.  workflow_dispatch runs use cancel-in-progress: false so they
# always complete.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK(s)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Configure Firebase google-services.json
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          TARGET_PATH="android/app/google-services.json"
          validate_google_services_json() {
            python - "$1" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          clients = data.get("client", [])
          has_android_client = any(
              client.get("client_info", {})
              .get("android_client_info", {})
              .get("package_name")
              == "com.wetalk"
              for client in clients
          )

          if not has_android_client:
              raise SystemExit("google-services.json does not contain an Android client for package com.wetalk")
          PY
          }

          if [[ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]]; then
            if [[ -s "$TARGET_PATH" ]]; then
              validate_google_services_json "$TARGET_PATH"
              echo "fcm_enabled=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::warning::GOOGLE_SERVICES_JSON_B64 is not configured and no pre-existing android/app/google-services.json was found. Continuing with non-FCM APK build behavior."
            rm -f "$TARGET_PATH"
            echo "fcm_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > "$TARGET_PATH"

          if [[ ! -s "$TARGET_PATH" ]]; then
            echo "::error::Decoded google-services.json is missing or empty at $TARGET_PATH"
            exit 1
          fi

          validate_google_services_json "$TARGET_PATH"

          echo "fcm_enabled=true" >> "$GITHUB_OUTPUT"

      # Build release APK only.
      #
      # -PreactNativeArchitectures=arm64-v8a limits the build to one ABI in CI.
      # All four ABIs (armeabi-v7a, arm64-v8a, x86, x86_64) remain the default
      # for local builds via gradle.properties; CI overrides with the flag so the
      # build is 2-4× faster without affecting local or production distribution.
      - name: Assemble APK(s)
        env:
          SIGNALING_URL: ${{ secrets.SIGNALING_URL }}
          ROOM_ID: ${{ secrets.ROOM_ID }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease \
            --build-cache --no-daemon \
            -PreactNativeArchitectures=arm64-v8a

      - name: Verify Firebase generated resources
        if: steps.firebase_config.outputs.fcm_enabled == 'true'
        run: |
          set -euo pipefail
          SEARCH_ROOT="android/app/build/generated/res"

          # The pinned google-services plugin (4.4.2, part of the Kotlin
          # rewrite line introduced in 4.3.4) registers its output via AGP's
          # addGeneratedSourceDirectory, which writes the
          # generated values.xml into a directory named after the Gradle task
          # (processReleaseGoogleServices) rather than the legacy
          # google-services/release path. Locate the file resiliently so this
          # check keeps working across plugin/AGP versions.
          VALUES_PATH=""
          for candidate in \
            "$SEARCH_ROOT/processReleaseGoogleServices/values/values.xml" \
            "$SEARCH_ROOT/google-services/release/values/values.xml"; do
            if [[ -f "$candidate" ]]; then
              VALUES_PATH="$candidate"
              break
            fi
          done

          if [[ -z "$VALUES_PATH" ]]; then
            VALUES_PATH="$(find "$SEARCH_ROOT" -type f -name values.xml -ipath '*GoogleServices*' 2>/dev/null | sort | head -n 1)"
          fi

          if [[ -z "$VALUES_PATH" || ! -f "$VALUES_PATH" ]]; then
            echo "::error::Expected Firebase generated resource file (values.xml) was not found under $SEARCH_ROOT"
            exit 1
          fi

          echo "Verifying Firebase generated resources at $VALUES_PATH"

          if ! grep -Fq 'name="google_app_id"' "$VALUES_PATH"; then
            echo "::error::Missing google_app_id in $VALUES_PATH"
            exit 1
          fi

          if ! grep -Fq 'name="gcm_defaultSenderId"' "$VALUES_PATH"; then
            echo "::error::Missing gcm_defaultSenderId in $VALUES_PATH"
            exit 1
          fi

      - name: Verify bundled icon font
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"

          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::Release APK not found at $APK_PATH"
            exit 1
          fi

          # react-native-vector-icons/fonts.gradle copies the font into
          # assets/fonts/ inside the APK.  Confirm the calling-UI icon font is
          # present so the icons render on-device instead of falling back to emoji.
          FONT_ENTRY="assets/fonts/MaterialCommunityIcons.ttf"
          if ! unzip -l "$APK_PATH" | grep -Fq "$FONT_ENTRY"; then
            echo "::error::Icon font $FONT_ENTRY is missing from the built APK; calling-UI icons will not render"
            unzip -l "$APK_PATH" | grep -F 'assets/fonts/' || true
            exit 1
          fi
          echo "Verified $FONT_ENTRY is bundled in the APK"

      - name: Verify APK permissions
        run: |
          set -euo pipefail
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [[ ! -f "$APK_PATH" ]]; then
            echo "::error::Release APK not found at $APK_PATH"
            exit 1
          fi

          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/build-tools" ]]; then
            echo "::error::Android SDK build-tools directory is unavailable"
            exit 1
          fi

          AAPT_PATH="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [[ -z "$AAPT_PATH" ]]; then
            echo "::error::Unable to locate aapt in $SDK_ROOT/build-tools"
            exit 1
          fi

          echo "Using $AAPT_PATH to inspect $APK_PATH"
          PERMISSIONS_DUMP="$("$AAPT_PATH" dump permissions "$APK_PATH")"
          REQUIRED_PERMISSIONS=(
            "android.permission.INTERNET"
            "android.permission.CAMERA"
            "android.permission.RECORD_AUDIO"
            "android.permission.MODIFY_AUDIO_SETTINGS"
            "android.permission.WAKE_LOCK"
            "android.permission.ACCESS_NETWORK_STATE"
            "android.permission.BLUETOOTH"
            "android.permission.BLUETOOTH_CONNECT"
            "android.permission.VIBRATE"
            "android.permission.USE_FULL_SCREEN_INTENT"
            "android.permission.FOREGROUND_SERVICE"
            "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"
          )

          for permission in "${REQUIRED_PERMISSIONS[@]}"; do
            if ! grep -Fq "$permission" <<<"$PERMISSIONS_DUMP"; then
              echo "::error::Built APK is missing required permission $permission"
              echo "$PERMISSIONS_DUMP"
              exit 1
            fi
          done

          # Screen sharing captures through MediaProjection, which delivers no
          # frames unless react-native-webrtc's foreground service survives the
          # manifest merge into the assembled APK (the remote peer would only
          # ever see black). Permissions alone do not prove the service is there.
          MANIFEST_DUMP="$("$AAPT_PATH" dump xmltree "$APK_PATH" AndroidManifest.xml)"
          if ! grep -Fq "MediaProjectionService" <<<"$MANIFEST_DUMP"; then
            echo "::error::Built APK does not declare the WebRTC MediaProjection foreground service"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
          if-no-files-found: error
